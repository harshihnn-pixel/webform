<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CFF — Company Formation Framework</title>
<meta name="description" content="Understand your values, life journey, strengths, and role in building a successful company.">

<!-- PWA: installable "Add to Home Screen" support on Android/iOS/desktop -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFF">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div id="root"></div>

<div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<noscript>
  <div class="noscript-banner">CFF requires JavaScript to run. Please enable JavaScript in your browser.</div>
</noscript>

<!-- Loaded as plain classic scripts (not type="module") so the whole site,
     including this file, can be opened directly from disk (file://) as well
     as served over http(s) via `npm start`. Order matters:

       1. config.js        — defines window.CFF_CONFIG (generated by the
                             server at runtime so keys stay in .env)
       2. vendor/supabase.js — Supabase browser SDK, served from our own
                             origin, not a CDN, so CSP stays script-src 'self'
       3. storage.js       — local persistence helpers
       4. auth.js          — needs both CFF_CONFIG and the Supabase SDK
       5. api.js           — backend client
       6. app.js           — uses all of the above
       7. ai-widget.js
-->
<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/ai-widget.js"></script>

<!-- Register the service worker for offline support + installability.
     Guarded so it never throws on file:// (service workers require
     http/https) or in browsers without support. -->
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('CFF: service worker registration failed', err);
      });
    });
  }
</script>
</body>
</html>
